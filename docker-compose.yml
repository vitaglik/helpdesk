version: '3.9'

services:
  nginx:
    image: nginx:latest
    container_name: helpdesk-nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    environment:
      PHP_IDE_CONFIG: "serverName=helpdesk"
    depends_on:
      - php

  php:
    build: .
    container_name: helpdesk-php
    volumes:
      - ./src:/var/www/html